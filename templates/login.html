 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Job Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #102f68, #2563eb, #60a5fa);
            display: flex;
            flex-direction: column;
        }

        .login-navbar {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-navbar .logo {
            color: #173b76;
            font-size: 25px;
            font-weight: 800;
        }

        .login-navbar .logo span {
            color: #3478f6;
        }

        .login-navbar a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.18);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 18px;
        }

        .login-box h2 {
            text-align: center;
            color: #172554;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 27px;
        }

        .login-box label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .login-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #1747ae;
        }

        .login-message {
            background: #eff6ff;
            color: #1e40af;
            padding: 11px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .register-text {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-top: 23px;
        }

        .register-text a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            font-size: 14px;
            text-decoration: none;
        }

        .back-home:hover,
        .register-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 27px 22px;
            }
        }
    </style>
</head>

<body>

<header class="login-navbar">
    <a href="{{ url_for('login') }}" class="logo">
        Job<span>Portal.</span>
    </a>

    <a href="{{ url_for('register') }}">Create Account</a>
</header>

<div class="login-wrapper">

    <div class="login-box">

        <div class="login-icon">👤</div>

        <h2>Welcome Back!</h2>

        <p class="login-subtitle">
            Login to continue your career journey.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="login-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-button">
                Login to Account →
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

        <a href="{{ url_for('login') }}" class="back-home">
            Job Portal Login
        </a>

    </div>

</div>

</body>
</html>
